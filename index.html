<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Uninvited</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas
      id="unity-canvas"
      width="1280"
      height="720"
      tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Uninvited</div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(message, type) {
      var warningBanner = document.querySelector("#unity-warning");
      var messageElement = document.createElement("div");

      messageElement.innerHTML = message;
      warningBanner.appendChild(messageElement);

      if (type === "error") {
        messageElement.style.background = "red";
        messageElement.style.padding = "10px";
      } else {
        if (type === "warning") {
          messageElement.style.background = "yellow";
          messageElement.style.padding = "10px";
        }

        setTimeout(function () {
          if (messageElement.parentNode === warningBanner) {
            warningBanner.removeChild(messageElement);
          }

          warningBanner.style.display =
            warningBanner.children.length > 0 ? "block" : "none";
        }, 5000);
      }

      warningBanner.style.display = "block";
    }

    var buildUrl = "Build";

    var loaderUrl =
      buildUrl + "/uninvited-web-fixed.loader.js";

    var config = {
      arguments: [],

      dataUrl:
        "https://pub-956a3a089299401198da1bc3b5e8cae0.r2.dev/uninvited-web-fixed.data.unityweb",

      frameworkUrl:
        buildUrl + "/uninvited-web-fixed.framework.js.unityweb",

      codeUrl:
        buildUrl + "/uninvited-web-fixed.wasm.unityweb",

      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Uninvited",
      productVersion: "0.1.0",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var viewportMeta = document.createElement("meta");

      viewportMeta.name = "viewport";
      viewportMeta.content =
        "width=device-width, height=device-height, initial-scale=1.0, " +
        "user-scalable=no, shrink-to-fit=yes";

      document.head.appendChild(viewportMeta);

      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";

      config.devicePixelRatio = 1;
    } else {
      canvas.style.width = "1280px";
      canvas.style.height = "720px";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var loaderScript = document.createElement("script");
    loaderScript.src = loaderUrl;

    loaderScript.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#unity-progress-bar-full").style.width =
          (progress * 100) + "%";
      })
      .then(function (unityInstance) {
        document.querySelector("#unity-loading-bar").style.display = "none";

        document.querySelector("#unity-fullscreen-button").onclick =
          function () {
            unityInstance.SetFullscreen(1);
          };
      })
      .catch(function (message) {
        alert(message);
      });
    };

    loaderScript.onerror = function () {
      alert(
        "Could not load the Unity loader file: " +
        loaderUrl
      );
    };

    document.body.appendChild(loaderScript);
  </script>
</body>
</html>
